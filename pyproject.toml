[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ticketmaster"
dynamic = ["version"]
description = "Live swimlane board of wayfinder maps on GitHub, GitLab, Gitea/Forgejo and Linear, and of standalone specs on GitHub, GitLab, Gitea/Forgejo and Linear, in herdr, starting each ticket in its own worktree workspace with Claude Code"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["textual>=0.80,<9"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ticketmaster = "ticketmaster.cli:main"

[tool.hatch.version]
path = "ticketmaster/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["ticketmaster"]

[tool.pytest.ini_options]
testpaths = ["tests"]
